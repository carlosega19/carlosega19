<svg width="780" height="145" viewBox="0 0 780 145" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="darkBg" x1="0" y1="0" x2="780" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09080E" />
      <stop offset="50%" stop-color="#110C1B" />
      <stop offset="100%" stop-color="#09080E" />
    </linearGradient>

    
    <linearGradient id="cyberPink" x1="80" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
